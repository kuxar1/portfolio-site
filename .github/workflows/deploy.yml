name: Terraform
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-portfolio-site
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  HUGO_VERSION: "0.168.0"

jobs:
  Deploy:
    name: Terraform
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://devopsing.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Install Hugo
        run: |
          curl -fsSL /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION }/hugo_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build Hugo site
        run: hugo --gc --minify
    
      - name: Check if Hugo build was successful
        run:  test -f public/index.html && test -f public/404.html

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform init
        run: terraform init
        working-directory: infra

      - name: Terraform validate
        run: terraform validate
        working-directory: infra

      - name: Terraform plan
        run: terraform plan -out=tfplan
        working-directory: infra

      - name: Terraform apply
        run: terraform apply tfplan
        working-directory: infra

      - name: Read Terraform outputs
        id: tf
        working-directory: infra
        run: |
          echo "bucket=$(terraform output -raw site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Deploy to S3
        env:
          BUCKET: ${{ steps.tf.outputs.bucket }}
        run: aws s3 sync public/ s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.tf.outputs.distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
