name: Terraform

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-portfolio-site
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  HUGO_VERSION: "0.168.0"

jobs:
  hugo-build:
    name: Setup and built hugo
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
        - name: Install Hugo
          run: |
            curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
            sudo dpkg -i /tmp/hugo.deb
            hugo version

        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Build Hugo site
          run: hugo --gc --minify
      
        - name: Check if Hugo build was successful
          run:  test -f public/index.html && test -f public/404.html

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            // Hidden HTML marker: lets the next run find and update this comment instead of adding a new one
            const marker = '<!-- terraform-plan -->';
            const maxLength = 60000;

            // stdout holds the plan, stderr holds errors; show both
            let output = process.env.PLAN_STDOUT || '';
            if (process.env.PLAN_STDERR) {
              output += '\n--- stderr ---\n' + process.env.PLAN_STDERR;
            }
            // GitHub rejects comments over 65536 chars; keep the tail, where the summary and errors are
            if (output.length > maxLength) {
              output = '... truncated, full output is in the workflow log ...\n' + output.slice(-maxLength);
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              `#### Terraform plan: \`${process.env.PLAN_OUTCOME}\``,
              '<details><summary>Show output</summary>',
              '',
              '```terraform',
              output,
              '```',
              '',
              '</details>',
              '',
              `Commit \`${sha}\` · [workflow run](${runUrl})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
